[project]
name = "seafin-metadata-builder"
version = "1.0.0"
description = "髒資料處理工具：Bronze/Silver 架構，Excel/CSV schema 轉換"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SPE Bank Recon Team"}]
readme = "README.md"

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
]
